<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="config/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Inicio de Sesión</title>
</head>

<body>
    <header>
        <span>
            <h2>¡Bienvenido a:</h2>
            <h1>Rivera del Oeste!</h1>
            <h4>Un PH conectado , seguro y en seguridad</h4>
        </span>
        <img src="img/logo.png" alt="logo">
        <div class="noticias">
            <h5><i class="bi bi-megaphone"></i>Comunicados y Noticias</h5>
            <h6>Ver todas</h6>
        </div>

    </header>
    <hr>
    <form action="" method="post">
        <h1><i class="bi bi-house-lock"></i>Iniciar Sesión</h1>
        <h5>Ingresa tus credenciales para acceder al sistema</h5>
        <label for="users-user">Usuario</label>
        <div class="datos">
            <i class="bi bi-person"></i>
            <input type="text" name="users-user" id="users-user">
        </div>
        <label for="users-password">Usuario</label>
        <div class="datos">
            <i class="bi bi-lock"></i>
            <input type="text" name="users-password" id="users-password">
            <i class="bi bi-eye-slash"></i>
            <i class="bi bi-eye"></i>
        </div>
    </form>

</body>

</html>
